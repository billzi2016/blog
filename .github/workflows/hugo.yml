# 意图：在推送 main 分支后构建 Hugo 静态站点，并部署到 GitHub Pages。
# 维护原则：工作流只负责构建和部署，不混入内容生成、测试造数或本机路径。

name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Hugo 版本固定，避免构建结果随 GitHub Runner 环境变化而漂移。
      HUGO_VERSION: 0.148.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 当前主题通过 Hugo Modules 引入，不使用 Git submodule。
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Hugo Modules 需要 Go 工具链解析和下载主题模块。
          go-version-file: go.mod

      - name: Install Hugo
        run: |
          wget -O "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"

      - name: Download Hugo modules
        # 显式下载主题依赖，让模块解析失败时在构建前暴露清楚。
        run: hugo mod get

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 新仓库首次部署时自动启用 Pages，避免 Pages 尚未配置导致工作流失败。
          enablement: true

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        # Pages 输出的 base_url 是部署时的真实站点入口；不要在仓库里写本机路径。
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
