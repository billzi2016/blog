# 意图：Hugo 站点主配置，使用 PaperMod 主题提供博客页面、SEO、RSS 和响应式布局。
# 维护原则：优先使用主题已有能力；只有主题无法满足且 specs 明确要求时，才增加本仓库自定义模板。

baseURL = "https://example.com/"
languageCode = "zh-cn"
title = "我的博客"
timeZone = "Asia/Shanghai"
enableRobotsTXT = true

[params]
  # PaperMod 会读取这些元信息生成页面标题、描述、SEO 标签和主题入口。
  description = "按题目组织，按日期记录。"
  author = "bizi"
  keywords = ["Hugo", "静态博客", "个人写作", "Markdown", "GitHub Pages", "题目归档", "日期记录"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    # 首页文案交给主题的 home-info 模式，不再维护自写首页模板。
    Title = "我的博客"
    Content = "按题目组织文章，用日期记录时间。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/billzi2016/blog"

[menu]
  # 导航使用主题菜单系统，避免在 layouts 中硬编码页头链接。
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10

  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20

  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/billzi2016/blog"
    weight = 30

[permalinks]
  # URL 以题目 slug 为主，不把日期放进永久链接，符合“题目为主，日期为辅”的产品约束。
  posts = "/posts/:slug/"

[taxonomies]
  # 标签和分类只承担聚合功能，不替代文章主标题。
  tag = "tags"
  category = "categories"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允许文章中嵌入少量可信 HTML；写作时仍优先使用 Markdown。
      unsafe = true

[outputs]
  # 首页额外输出 RSS，方便以后接入订阅入口。
  home = ["HTML", "RSS"]

[module]
  # PaperMod 通过 Hugo Modules 引入；构建时下载主题，不提交第三方主题源码。
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"
