{{/* 意图：单篇内容页模板；标题是主信息，日期和标签作为辅助元信息。 */}}
{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <p class="post-date">{{ .Date.Format "2006-01-02" }}</p>
      <h1>{{ .Title }}</h1>
      {{ with .Params.tags }}
        {{/* 标签链接使用 urlize，避免中文、空格或大小写导致 URL 不稳定。 */}}
        <div class="tags" aria-label="标签">
          {{ range . }}
            <a href="{{ "tags/" | relLangURL }}{{ . | urlize }}/">#{{ . }}</a>
          {{ end }}
        </div>
      {{ end }}
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
