<!-- 意图：为 Hugo PaperMod 主题引入 Mermaid.js 图表实时渲染引擎。 -->
<!-- 维护原则：Mermaid 代码块由 Hugo render hook 标记；这里只在页面确实使用图表时加载脚本。 -->
{{ if or (.Store.Get "hasMermaid") .Params.mermaid }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";

  const isDark = document.body.classList.contains("dark");
  mermaid.initialize({
    startOnLoad: false,
    theme: isDark ? "dark" : "default"
  });
  await mermaid.run({ querySelector: ".mermaid" });
</script>
{{ end }}
