{{/* 意图：全站页脚；保持轻量，只展示站点版权和生成器信息。 */}}
<footer class="site-footer">
  <p>{{ now.Format "2006" }} {{ site.Title }}. Powered by Hugo.</p>
  {{ with site.Params.links }}
    {{/* 页脚链接从 hugo.toml 读取，新增公开入口时只改配置。 */}}
    <nav class="footer-links" aria-label="相关链接">
      {{ range . }}
        <a href="{{ .url }}">{{ .name }}</a>
      {{ end }}
    </nav>
  {{ end }}
</footer>
