{{/* 意图：文章卡片局部模板；统一首页和列表页中的文章摘要展示。 */}}
{{/* 维护原则：卡片只显示标题、日期、摘要，避免重复单篇页的正文逻辑。 */}}
<article class="post-card">
  <a class="post-card-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  {{ with .Summary }}
    <p>{{ . | plainify }}</p>
  {{ end }}
</article>
